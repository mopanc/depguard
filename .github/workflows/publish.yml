name: Publish to npm

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high --omit=dev

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      # Installed only after ci/build: npm 11's `npm ci` rejects this lock
      # file (it lacks esbuild's optional platform packages, which npm 10
      # tolerates). Pinned to an exact, month-old release rather than latest.
      - run: npm install -g npm@11.19.1
      # With a trusted publisher configured on npmjs.com, npm authenticates via
      # OIDC (id-token: write above) and ignores NODE_AUTH_TOKEN. The token is
      # only a fallback until that is set up: bypass-2FA tokens lose publish
      # rights in January 2027. Remove it once an OIDC publish has succeeded.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
