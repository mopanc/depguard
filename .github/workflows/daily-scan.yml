name: Daily Security Scan

on:
  schedule:
    # Off the top of the hour: GitHub queues :00 schedules heavily (runs were
    # starting 5-8h late). 05:17 UTC lands well before the European workday.
    - cron: '17 5 * * *'
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # PAT for an admin user — main is protected and the default GITHUB_TOKEN
          # cannot bypass the "require pull request" rule. Admins can (enforce_admins
          # is false), so we push as the admin via this fine-grained token.
          token: ${{ secrets.DAILY_SCAN_PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - name: Refresh advisory-db from GHSA
        run: npx tsx scripts/refresh-advisory-db.ts
        # Incremental runs take seconds; a rebuild after an importer change
        # (importerVersion bump) re-reads ~11 months of malware advisories
        # once (600+ pages, measured at ~25 min locally).
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A refreshed database must never flag known-clean versions or the most
      # popular packages at their current version. Failing here stops the job
      # before the commit step, so a database with a false positive never
      # reaches main or a release.
      - name: Precision gate (no false positives)
        run: node --import tsx --test tests/advisory-precision.test.ts

      - name: Run daily scan
        run: npx tsx scripts/daily-scan.ts
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Process alerts (dedup, rolling issue)
        run: npx tsx scripts/daily-scan-alert.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit and push results
        run: |
          git config user.name "depguard-bot"
          git config user.email "depguard-bot@users.noreply.github.com"
          git add src/data/advisory-db.json docs/data/daily-scan.json .github/state/daily-scan-state.json
          git diff --staged --quiet || git commit -m "data: daily security scan $(date -u +%Y-%m-%d)"
          git push
