name: Daily Security Scan

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT for an admin user — main is protected and the default GITHUB_TOKEN
          # cannot bypass the "require pull request" rule. Admins can (enforce_admins
          # is false), so we push as the admin via this fine-grained token.
          token: ${{ secrets.DAILY_SCAN_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - name: Run daily scan
        run: npx tsx scripts/daily-scan.ts
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Process alerts (dedup, rolling issue)
        run: npx tsx scripts/daily-scan-alert.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit and push results
        run: |
          git config user.name "depguard-bot"
          git config user.email "depguard-bot@users.noreply.github.com"
          git add docs/data/daily-scan.json .github/state/daily-scan-state.json
          git diff --staged --quiet || git commit -m "data: daily security scan $(date -u +%Y-%m-%d)"
          git push
